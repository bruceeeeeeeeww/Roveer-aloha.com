<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0d655f" />
  <title>羅浮音樂會｜管理員</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page-bg"></div>
  <main class="admin-page">
    <header class="admin-top">

      <h1 style="font-size:clamp(34px,6vw,58px)">🏖️ 羅浮音樂會🍹</h1>
      <div class="subtitle">票選管理</div>
    </header>

    <section class="panel">
      <div class="section-kicker">ADMIN DASHBOARD</div>
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
        <h2 style="margin-bottom:0">即時票選結果</h2>
        <a href="./index.html" class="secondary-btn" style="text-decoration:none">← 返回投票頁</a>
      </div>

      <div id="statusBox" style="margin-top:12px"></div>

      <div class="admin-summary">
        <div class="admin-stat"><span id="totalVotes" class="n">—</span><span class="l">已完成投票</span></div>
        <div class="admin-stat"><span id="unusedCodes" class="n">—</span><span class="l">未使用投票碼</span></div>
        <div class="admin-stat"><span id="totalCodes" class="n">—</span><span class="l">總投票碼</span></div>
        <div class="admin-stat"><span id="candidateCount" class="n">—</span><span class="l">候選人</span></div>
      </div>

      <div class="admin-toolbar">
        <button id="refreshBtn" class="primary-btn">重新整理結果</button>
        <button id="closeVotingBtn" class="danger-btn">🔒 關閉投票</button>
        <button id="openVotingBtn" class="open-btn">🟢 重新開放投票</button>
        <button id="logoutBtn" class="secondary-btn">登出管理員</button>
      </div>

      <p id="adminMsg" class="message"></p>

      <div class="results-table-wrap">
        <table class="results-table">
          <thead>
            <tr>
              <th>排名</th>
              <th>參賽者</th>
              <th>歌曲</th>
              <th>得票</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyDWx4lHtCGnAoiiLEubgnrInu_6UnqCjqSk2ky7IlqP1inBb2Z3AckYGTRsBgXQTLe_A/exec";
    const pin = sessionStorage.getItem("luofuAdminPin");
    const $ = id => document.getElementById(id);

    if (!pin) location.href = "./index.html";

    async function apiPost(body){
      const res = await fetch(API_URL,{
        method:"POST",
        redirect:"follow",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(body)
      });
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.json();
    }

    function msg(text, ok=false){
      $("adminMsg").textContent = text || "";
      $("adminMsg").classList.toggle("ok", ok);
    }

    async function loadDashboard(){
      msg("讀取中…", true);
      try{
        const r = await apiPost({action:"adminDashboard", pin});
        if(!r.ok){
          sessionStorage.removeItem("luofuAdminPin");
          alert(r.message || "管理員驗證失敗");
          location.href="./index.html";
          return;
        }

        $("totalVotes").textContent = r.totalVotes;
        $("unusedCodes").textContent = r.unusedCodes;
        $("totalCodes").textContent = r.totalCodes;
        $("candidateCount").textContent = r.candidateCount;

        const isOpen = r.votingStatus === "開放";
        $("statusBox").innerHTML =
          '<span class="status-pill '+(isOpen?'status-open':'status-closed')+'">'+
          (isOpen?'🟢 投票開放中':'🔒 投票已關閉')+'</span>';

        $("openVotingBtn").style.display = isOpen ? "none" : "inline-block";
        $("closeVotingBtn").style.display = isOpen ? "inline-block" : "none";

        const body = $("resultsBody");
        body.innerHTML = "";
        r.results.forEach((item,i)=>{
          const tr=document.createElement("tr");
          const rank=i===0?"🥇":i===1?"🥈":i===2?"🥉":String(i+1);
          tr.innerHTML =
            '<td>'+rank+'</td>'+
            '<td><strong>'+escapeHtml(item.nickname || item.name)+'</strong>'+
            (item.nickname && item.nickname!==item.name?'<br><small>'+escapeHtml(item.name)+'</small>':'')+
            '</td>'+
            '<td>'+escapeHtml(item.song || "—")+'</td>'+
            '<td>'+item.votes+'</td>';
          body.appendChild(tr);
        });
        msg("已更新", true);
      }catch(e){
        console.error(e);
        msg("讀取失敗，請稍後再試");
      }
    }

    async function setStatus(status){
      const text = status==="開放" ? "重新開放投票" : "關閉投票";
      if(!confirm("確定要"+text+"？")) return;
      try{
        const r = await apiPost({action:"setVotingStatus", pin, status});
        if(!r.ok){ msg(r.message || "操作失敗"); return; }
        msg(r.message, true);
        await loadDashboard();
      }catch(e){
        console.error(e);
        msg("操作失敗");
      }
    }

    function escapeHtml(v){
      return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;")
        .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    $("refreshBtn").addEventListener("click",loadDashboard);
    $("closeVotingBtn").addEventListener("click",()=>setStatus("關閉"));
    $("openVotingBtn").addEventListener("click",()=>setStatus("開放"));
    $("logoutBtn").addEventListener("click",()=>{
      sessionStorage.removeItem("luofuAdminPin");
      location.href="./index.html";
    });

    loadDashboard();
  </script>
</body>
</html>
